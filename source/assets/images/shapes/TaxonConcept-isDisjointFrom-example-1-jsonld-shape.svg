<!-- lit_b1_comment_1 -->
<g id="node7" class="node">
<title>lit_b1_comment_1</title>
<path fill="#ffffff" stroke="#b0bec5" d="M825.58,-251.67C825.58,-251.67 627.58,-251.67 627.58,-251.67 621.58,-251.67 615.58,-245.67 615.58,-239.67 615.58,-239.67 615.58,-145.67 615.58,-145.67 615.58,-139.67 621.58,-133.67 627.58,-133.67 627.58,-133.67 825.58,-133.67 825.58,-133.67 831.58,-133.67 837.58,-139.67 837.58,-145.67 837.58,-145.67 837.58,-239.67 837.58,-239.67 837.58,-245.67 831.58,-251.67 825.58,-251.67"/>
<text text-anchor="middle" x="726.58" y="-239.67" font-family="Arial,Helvetica" font-size="10.00">Mit dem Taxon in Mönkemeyer ist der</text>
<text text-anchor="middle" x="726.58" y="-228.67" font-family="Arial,Helvetica" font-size="10.00">Beschreibung nach eindeutig *C. pilifer Brid.</text>
<text text-anchor="middle" x="726.58" y="-217.67" font-family="Arial,Helvetica" font-size="10.00">(C. polytrichoides De Not.), eine</text>
<text text-anchor="middle" x="726.58" y="-206.67" font-family="Arial,Helvetica" font-size="10.00">ozeanisch&#45;submediterrane Art, gemeint. In</text>
<text text-anchor="middle" x="726.58" y="-195.67" font-family="Arial,Helvetica" font-size="10.00">älteren Floren wird C. introflexus, bevor</text>
<text text-anchor="middle" x="726.58" y="-184.67" font-family="Arial,Helvetica" font-size="10.00">diese Art von Störmer (1958) für Europa</text>
<text text-anchor="middle" x="726.58" y="-173.67" font-family="Arial,Helvetica" font-size="10.00">nachgewiesen wurde, regelmäßig als Synonym</text>
<text text-anchor="middle" x="726.58" y="-162.67" font-family="Arial,Helvetica" font-size="10.00">von C. polytrichoides aufgeführt oder in</text>
<text text-anchor="middle" x="726.58" y="-151.67" font-family="Arial,Helvetica" font-size="10.00">diesem Sinne verwendet (vgl. u. a. Demaret &amp;</text>
<text text-anchor="middle" x="726.58" y="-140.67" font-family="Arial,Helvetica" font-size="10.00">Castagne 1961: 203)</text>
</g>
