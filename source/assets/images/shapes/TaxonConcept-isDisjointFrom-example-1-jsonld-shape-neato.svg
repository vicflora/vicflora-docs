<path fill="#ffffff" stroke="#b0bec5" d="M210,-464.19C210,-464.19 12,-464.19 12,-464.19 6,-464.19 0,-458.19 0,-452.19 0,-452.19 0,-358.19 0,-358.19 0,-352.19 6,-346.19 12,-346.19 12,-346.19 210,-346.19 210,-346.19 216,-346.19 222,-352.19 222,-358.19 222,-358.19 222,-452.19 222,-452.19 222,-458.19 216,-464.19 210,-464.19"/>
<text text-anchor="middle" x="111" y="-452.19" font-family="Arial,Helvetica" font-size="10.00">Mit dem Taxon in Mönkemeyer ist der</text>
<text text-anchor="middle" x="111" y="-441.19" font-family="Arial,Helvetica" font-size="10.00">Beschreibung nach eindeutig *C. pilifer Brid.</text>
<text text-anchor="middle" x="111" y="-430.19" font-family="Arial,Helvetica" font-size="10.00">(C. polytrichoides De Not.), eine</text>
<text text-anchor="middle" x="111" y="-419.19" font-family="Arial,Helvetica" font-size="10.00">ozeanisch&#45;submediterrane Art, gemeint. In</text>
<text text-anchor="middle" x="111" y="-408.19" font-family="Arial,Helvetica" font-size="10.00">älteren Floren wird C. introflexus, bevor</text>
<text text-anchor="middle" x="111" y="-397.19" font-family="Arial,Helvetica" font-size="10.00">diese Art von Störmer (1958) für Europa</text>
<text text-anchor="middle" x="111" y="-386.19" font-family="Arial,Helvetica" font-size="10.00">nachgewiesen wurde, regelmäßig als Synonym</text>
<text text-anchor="middle" x="111" y="-375.19" font-family="Arial,Helvetica" font-size="10.00">von C. polytrichoides aufgeführt oder in</text>
<text text-anchor="middle" x="111" y="-364.19" font-family="Arial,Helvetica" font-size="10.00">diesem Sinne verwendet (vgl. u. a. Demaret &amp;</text>
<text text-anchor="middle" x="111" y="-353.19" font-family="Arial,Helvetica" font-size="10.00">Castagne 1961: 203)</text>
</g>
