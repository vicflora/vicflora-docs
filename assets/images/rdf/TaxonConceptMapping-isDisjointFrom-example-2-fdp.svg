<g id="node12" class="node">
<title>Mit dem Taxon in Mönkemeyer ist der Beschreibung nach 
 &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;eindeutig *C. pilifer Brid. (C. polytrichoides De Not.), eine 
 &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;ozeanisch&#45;submediterrane Art, gemeint. In älteren Floren wird C. 
 &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;introflexus, bevor diese Art von Störmer (1958) für Europa 
 &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;nachgewiesen wurde, regelmäßig als Synonym von C. polytrichoides 
 &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;aufgeführt oder in diesem Sinne verwendet (vgl. u. a. Demaret &amp; 
 &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;Castagne 1961: 203)</title>
<path fill="#fff3e0" stroke="#fb8c00" d="M210.24,-273.09C210.24,-273.09 12.24,-273.09 12.24,-273.09 6.24,-273.09 0.24,-267.09 0.24,-261.09 0.24,-261.09 0.24,-156.09 0.24,-156.09 0.24,-150.09 6.24,-144.09 12.24,-144.09 12.24,-144.09 210.24,-144.09 210.24,-144.09 216.24,-144.09 222.24,-150.09 222.24,-156.09 222.24,-156.09 222.24,-261.09 222.24,-261.09 222.24,-267.09 216.24,-273.09 210.24,-273.09"/>
<text text-anchor="middle" x="111.24" y="-261.09" font-family="Arial,Helvetica" font-size="10.00">Mit dem Taxon in Mönkemeyer ist der</text>
<text text-anchor="middle" x="111.24" y="-250.09" font-family="Arial,Helvetica" font-size="10.00">Beschreibung nach &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;eindeutig *C.</text>
<text text-anchor="middle" x="111.24" y="-239.09" font-family="Arial,Helvetica" font-size="10.00">pilifer Brid. (C. polytrichoides De Not.),</text>
<text text-anchor="middle" x="111.24" y="-228.09" font-family="Arial,Helvetica" font-size="10.00">eine &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;ozeanisch&#45;submediterrane</text>
<text text-anchor="middle" x="111.24" y="-217.09" font-family="Arial,Helvetica" font-size="10.00">Art, gemeint. In älteren Floren wird C.</text>
<text text-anchor="middle" x="111.24" y="-206.09" font-family="Arial,Helvetica" font-size="10.00">introflexus, bevor diese Art von</text>
<text text-anchor="middle" x="111.24" y="-195.09" font-family="Arial,Helvetica" font-size="10.00">Störmer (1958) für Europa</text>
<text text-anchor="middle" x="111.24" y="-184.09" font-family="Arial,Helvetica" font-size="10.00">nachgewiesen wurde, regelmäßig als Synonym</text>
<text text-anchor="middle" x="111.24" y="-173.09" font-family="Arial,Helvetica" font-size="10.00">von C. polytrichoides &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;aufgeführt</text>
<text text-anchor="middle" x="111.24" y="-162.09" font-family="Arial,Helvetica" font-size="10.00">oder in diesem Sinne verwendet (vgl. u. a.</text>
<text text-anchor="middle" x="111.24" y="-151.09" font-family="Arial,Helvetica" font-size="10.00">Demaret &amp; &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;Castagne 1961: 203)</text>
</g>
