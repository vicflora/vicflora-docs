<title>lit_b1_comment_1</title>
<path fill="#ffffff" stroke="#b0bec5" d="M818.51,-252.02C818.51,-252.02 620.51,-252.02 620.51,-252.02 614.51,-252.02 608.51,-246.02 608.51,-240.02 608.51,-240.02 608.51,-146.02 608.51,-146.02 608.51,-140.02 614.51,-134.02 620.51,-134.02 620.51,-134.02 818.51,-134.02 818.51,-134.02 824.51,-134.02 830.51,-140.02 830.51,-146.02 830.51,-146.02 830.51,-240.02 830.51,-240.02 830.51,-246.02 824.51,-252.02 818.51,-252.02"/>
<text text-anchor="middle" x="719.51" y="-240.02" font-family="Arial,Helvetica" font-size="10.00">Mit dem Taxon in Mönkemeyer ist der</text>
<text text-anchor="middle" x="719.51" y="-229.02" font-family="Arial,Helvetica" font-size="10.00">Beschreibung nach eindeutig *C. pilifer Brid.</text>
<text text-anchor="middle" x="719.51" y="-218.02" font-family="Arial,Helvetica" font-size="10.00">(C. polytrichoides De Not.), eine</text>
<text text-anchor="middle" x="719.51" y="-207.02" font-family="Arial,Helvetica" font-size="10.00">ozeanisch&#45;submediterrane Art, gemeint. In</text>
<text text-anchor="middle" x="719.51" y="-196.02" font-family="Arial,Helvetica" font-size="10.00">älteren Floren wird C. introflexus, bevor</text>
<text text-anchor="middle" x="719.51" y="-185.02" font-family="Arial,Helvetica" font-size="10.00">diese Art von Störmer (1958) für Europa</text>
<text text-anchor="middle" x="719.51" y="-174.02" font-family="Arial,Helvetica" font-size="10.00">nachgewiesen wurde, regelmäßig als Synonym</text>
<text text-anchor="middle" x="719.51" y="-163.02" font-family="Arial,Helvetica" font-size="10.00">von C. polytrichoides aufgeführt oder in</text>
<text text-anchor="middle" x="719.51" y="-152.02" font-family="Arial,Helvetica" font-size="10.00">diesem Sinne verwendet (vgl. u. a. Demaret &amp;</text>
<text text-anchor="middle" x="719.51" y="-141.02" font-family="Arial,Helvetica" font-size="10.00">Castagne 1961: 203)</text>
</g>
