<g id="node12" class="node">
<title>Mit dem Taxon in Mönkemeyer ist der Beschreibung nach 
 &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;eindeutig *C. pilifer Brid. (C. polytrichoides De Not.), eine 
 &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;ozeanisch&#45;submediterrane Art, gemeint. In älteren Floren wird C. 
 &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;introflexus, bevor diese Art von Störmer (1958) für Europa 
 &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;nachgewiesen wurde, regelmäßig als Synonym von C. polytrichoides 
 &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;aufgeführt oder in diesem Sinne verwendet (vgl. u. a. Demaret &amp; 
 &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;Castagne 1961: 203)</title>
<path fill="#fff3e0" stroke="#fb8c00" d="M255.23,-553.47C255.23,-553.47 57.23,-553.47 57.23,-553.47 51.23,-553.47 45.23,-547.47 45.23,-541.47 45.23,-541.47 45.23,-436.47 45.23,-436.47 45.23,-430.47 51.23,-424.47 57.23,-424.47 57.23,-424.47 255.23,-424.47 255.23,-424.47 261.23,-424.47 267.23,-430.47 267.23,-436.47 267.23,-436.47 267.23,-541.47 267.23,-541.47 267.23,-547.47 261.23,-553.47 255.23,-553.47"/>
<text text-anchor="middle" x="156.23" y="-541.47" font-family="Arial,Helvetica" font-size="10.00">Mit dem Taxon in Mönkemeyer ist der</text>
<text text-anchor="middle" x="156.23" y="-530.47" font-family="Arial,Helvetica" font-size="10.00">Beschreibung nach &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;eindeutig *C.</text>
<text text-anchor="middle" x="156.23" y="-519.47" font-family="Arial,Helvetica" font-size="10.00">pilifer Brid. (C. polytrichoides De Not.),</text>
<text text-anchor="middle" x="156.23" y="-508.47" font-family="Arial,Helvetica" font-size="10.00">eine &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;ozeanisch&#45;submediterrane</text>
<text text-anchor="middle" x="156.23" y="-497.47" font-family="Arial,Helvetica" font-size="10.00">Art, gemeint. In älteren Floren wird C.</text>
<text text-anchor="middle" x="156.23" y="-486.47" font-family="Arial,Helvetica" font-size="10.00">introflexus, bevor diese Art von</text>
<text text-anchor="middle" x="156.23" y="-475.47" font-family="Arial,Helvetica" font-size="10.00">Störmer (1958) für Europa</text>
<text text-anchor="middle" x="156.23" y="-464.47" font-family="Arial,Helvetica" font-size="10.00">nachgewiesen wurde, regelmäßig als Synonym</text>
<text text-anchor="middle" x="156.23" y="-453.47" font-family="Arial,Helvetica" font-size="10.00">von C. polytrichoides &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;aufgeführt</text>
<text text-anchor="middle" x="156.23" y="-442.47" font-family="Arial,Helvetica" font-size="10.00">oder in diesem Sinne verwendet (vgl. u. a.</text>
<text text-anchor="middle" x="156.23" y="-431.47" font-family="Arial,Helvetica" font-size="10.00">Demaret &amp; &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;Castagne 1961: 203)</text>
</g>
